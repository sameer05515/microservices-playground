spring.application.name=TODO-SERVICE
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
server.error.include-stacktrace=never
app.refresh-token.cleanup-ms=${REFRESH_TOKEN_CLEANUP_MS:3600000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
app.redis.todo-cache-ttl-seconds=${TODO_CACHE_TTL_SECONDS:60}
app.redis.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:120}
app.redis.lock-ttl-seconds=${REDIS_LOCK_TTL_SECONDS:10}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
