# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/ex_base_17_backend_spring
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=your_super_secret_jwt_key_change_this_in_production_must_be_at_least_32_characters_long
jwt.expiration=86400000

# Logging
logging.level.com.p.backend=INFO
logging.level.org.springframework.security=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

