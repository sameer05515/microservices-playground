<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word CRUD App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">

  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6">
    <h2 class="text-2xl font-bold mb-4 text-blue-600">Create / Update Word</h2>
    <input type="hidden" id="wordId">

    <input id="word" placeholder="Word"
      class="w-full border rounded-lg p-2 mb-3 focus:ring-2 focus:ring-blue-400"/>

    <textarea id="meanings" placeholder="Meanings (comma separated)"
      class="w-full border rounded-lg p-2 mb-3 focus:ring-2 focus:ring-blue-400"></textarea>

    <textarea id="examples" placeholder="Examples (comma separated)"
      class="w-full border rounded-lg p-2 mb-3 focus:ring-2 focus:ring-blue-400"></textarea>

    <textarea id="description" placeholder="Description"
      class="w-full border rounded-lg p-2 mb-3 focus:ring-2 focus:ring-blue-400"></textarea>

    <button onclick="saveWord()"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white rounded-lg py-2 font-semibold transition">
      💾 Save Word
    </button>
  </div>

  <div class="w-full max-w-2xl mt-8">
    <h2 class="text-2xl font-bold mb-4 text-green-600">Words List</h2>
    <div id="wordsList" class="space-y-4"></div>
  </div>

<script>
const API = 'http://127.0.0.1:3090/words';

// Fetch all words
async function fetchWords() {
  const res = await fetch(API);
  const data = await res.json();
  const container = document.getElementById('wordsList');
  container.innerHTML = '';
  data.forEach(w => {
    const div = document.createElement('div');
    div.className = 'p-4 bg-white rounded-xl shadow border hover:shadow-lg transition';
    div.innerHTML = `
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800">${w.word}</h3>
        <div class="space-x-2">
          <button onclick="editWord('${w.id}')"
            class="px-3 py-1 text-sm bg-yellow-400 hover:bg-yellow-500 text-white rounded">
            ✏️ Edit
          </button>
          <button onclick="deleteWord('${w.id}')"
            class="px-3 py-1 text-sm bg-red-500 hover:bg-red-600 text-white rounded">
            🗑️ Delete
          </button>
        </div>
      </div>
      <p class="mt-2"><span class="font-semibold">Meanings:</span> ${w.meanings.join(', ')}</p>
      <p><span class="font-semibold">Examples:</span> ${w.examples.join(', ')}</p>
      <p><span class="font-semibold">Description:</span> ${w.description}</p>
      <p class="text-sm text-gray-500 mt-1">Created On: ${new Date(w.createdOn).toLocaleString()}</p>
    `;
    container.appendChild(div);
  });
}

// Save or update word
async function saveWord() {
  const id = document.getElementById('wordId').value;
  const word = document.getElementById('word').value.trim();
  const meanings = document.getElementById('meanings').value.split(',').map(s => s.trim()).filter(Boolean);
  const examples = document.getElementById('examples').value.split(',').map(s => s.trim()).filter(Boolean);
  const description = document.getElementById('description').value.trim();

  if (!word) return alert('Word is required');

  const payload = { word, meanings, examples, description };

  if (id) {
    await fetch(`${API}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } else {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }

  document.getElementById('wordId').value = '';
  document.getElementById('word').value = '';
  document.getElementById('meanings').value = '';
  document.getElementById('examples').value = '';
  document.getElementById('description').value = '';
  fetchWords();
}

// Edit word
async function editWord(id) {
  const res = await fetch(`${API}/${id}`);
  const w = await res.json();
  document.getElementById('wordId').value = w.id;
  document.getElementById('word').value = w.word;
  document.getElementById('meanings').value = w.meanings.join(', ');
  document.getElementById('examples').value = w.examples.join(', ');
  document.getElementById('description').value = w.description;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Delete word
async function deleteWord(id) {
  if (confirm('Are you sure you want to delete this word?')) {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    fetchWords();
  }
}

// Initial fetch
fetchWords();
</script>

</body>
</html>
