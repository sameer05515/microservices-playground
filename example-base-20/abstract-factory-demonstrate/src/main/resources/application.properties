spring.application.name=abstract-factory-database-demo
server.port=8080

# Database Type Selection
# Options: mysql, postgresql, mongodb
# Change this to switch between different database implementations
app.database.type=mysql

# MySQL Configuration
mysql.datasource.url=jdbc:mysql://localhost:3306/abstract_factory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.datasource.username=root
mysql.datasource.password=password

# PostgreSQL Configuration
postgresql.datasource.url=jdbc:postgresql://localhost:5432/abstract_factory_db
postgresql.datasource.username=postgres
postgresql.datasource.password=password

# MongoDB Configuration
mongodb.connection.string=mongodb://localhost:27017
mongodb.database.name=abstract_factory_db

# Logging
logging.level.com.p.abstractfactory=DEBUG
logging.level.org.springframework.web=INFO

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

