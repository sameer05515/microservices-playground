spring.application.name=search-api
server.port=8765

# External API URLs
external.api.base-url=http://127.0.0.1:3003
external.api.tags-url=${external.api.base-url}/tags
external.api.categories-url=${external.api.base-url}/categories
external.api.category-detail-url=${external.api.base-url}/categories/{id}
external.api.question-detail-url=${external.api.base-url}/categories/{categoryId}/questions/{questionId}
external.api.intvw-mgmt.base-url=${external.api.base-url}/intvw-mgmt
external.api.intvw-mgmt.categories-url=${external.api.intvw-mgmt.base-url}/categories
external.api.intvw-mgmt.questions-url=${external.api.intvw-mgmt.base-url}/questions
external.api.intvw-mgmt.answers-url=${external.api.intvw-mgmt.base-url}/answers

# RestTemplate Configuration
rest.template.connect-timeout=5000
rest.template.read-timeout=10000

# External API URLs (for backward compatibility)
external.api.example-url=https://jsonplaceholder.typicode.com/posts/1
