server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_gym?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:local-demo-secret-please-change-this-to-a-random-secret-of-32-chars}
    expiration-minutes: 720
  questions-file: ${QUESTIONS_FILE:}
