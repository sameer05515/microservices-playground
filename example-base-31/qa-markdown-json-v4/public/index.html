<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Markdown Q&A — V4</title>
  <script>
    tailwind = { darkMode: 'class' };
    const bootTheme = localStorage.getItem('qa-theme');
    if (bootTheme === 'dark' || (!bootTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.3.0/lib/marked.umd.js"></script>
</head>
<body class="min-h-full bg-slate-50 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100">
<header class="border-b border-slate-800 bg-slate-900 text-white dark:bg-slate-950">
  <div class="mx-auto flex max-w-6xl flex-col gap-4 px-5 py-5 sm:flex-row sm:items-center sm:justify-between">
    <div><h1 class="text-2xl font-bold">Markdown Q&A</h1><p class="mt-1 text-sm text-slate-400">Multiple answers · Markdown · JSON persistence · Tailwind CSS</p></div>
    <div class="flex w-full gap-2 sm:w-auto">
      <button id="themeBtn" type="button" class="flex-1 rounded-lg bg-slate-700 px-4 py-2.5 text-sm font-semibold hover:bg-slate-600 sm:flex-none">🌙 Dark</button>
      <button id="newBtn" class="flex-1 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold hover:bg-blue-500 sm:flex-none">+ New Question</button>
    </div>
  </div>
</header>
<main class="mx-auto max-w-6xl px-5 py-7">
  <section class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center">
    <input id="search" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none ring-blue-500 transition focus:ring-2 dark:border-slate-700 dark:bg-slate-900" placeholder="Search questions, answers or tags..." />
    <span id="count" class="whitespace-nowrap text-sm text-slate-500 dark:text-slate-400"></span>
  </section>
  <section id="list"></section>
</main>
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-5">
  <div class="max-h-[92vh] w-full max-w-4xl overflow-auto rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl dark:border-slate-700 dark:bg-slate-900">
    <div class="mb-5 flex items-center justify-between"><h2 id="modalTitle" class="text-xl font-bold">New Question</h2><button id="closeBtn" class="text-3xl leading-none text-slate-500 hover:text-slate-900 dark:hover:text-white">×</button></div>
    <form id="form">
      <input type="hidden" id="qid" />
      <label class="mb-4 block text-sm font-semibold">Question<input id="question" required class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 font-normal outline-none focus:ring-2 focus:ring-blue-500 dark:border-slate-700 dark:bg-slate-950" /></label>
      <label class="mb-5 block text-sm font-semibold">Tags <small class="font-normal text-slate-500">comma separated</small><input id="tags" placeholder="java, spring, collections" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 font-normal outline-none focus:ring-2 focus:ring-blue-500 dark:border-slate-700 dark:bg-slate-950" /></label>
      <div class="mb-3 flex items-center justify-between"><h3 class="font-bold">Answers</h3><button type="button" id="addAnswer" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-500">+ Add Answer</button></div>
      <div id="answers"></div>
      <div class="mt-5 flex justify-end gap-2"><button type="button" class="rounded-lg bg-slate-500 px-4 py-2.5 font-semibold text-white" id="cancelBtn">Cancel</button><button class="rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-500">Save</button></div>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
