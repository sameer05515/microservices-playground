spring.application.name=mini-gmail
server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mini_gmail}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.thymeleaf.cache=false

app.upload-dir=${UPLOAD_DIR:src/main/resources/static/uploads}
