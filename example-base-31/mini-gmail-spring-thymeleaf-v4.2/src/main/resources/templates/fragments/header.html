<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Gmail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar" th:fragment="header">
    <a class="brand" th:href="@{/mail}">✉ Mini Gmail</a>
    <form class="search" th:action="@{/mail}" method="get">
        <input name="q" placeholder="Search mail" th:value="${q}">
        <input type="hidden" name="box" th:value="${box != null ? box : 'inbox'}">
        <button>Search</button>
    </form>
    <div class="user-area" th:text="${#authentication != null ? #authentication.name : 'user'}">user</div>
</header>
