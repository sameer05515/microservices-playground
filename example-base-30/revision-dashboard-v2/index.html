<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Dashboard V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
<div x-data="revisionApp()" x-init="init()" class="min-h-screen">

<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
<div class="mx-auto max-w-7xl px-4 py-4 sm:px-6">
<div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
<div>
<h1 class="text-2xl font-bold">🚀 Revision Dashboard <span class="text-indigo-600">V2</span></h1>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Java → Spring → Microservices → System Design → AWS → DevOps</p>
</div>
<div class="flex flex-wrap gap-2">
<button @click="dark=!dark;saveTheme()" class="rounded-lg border px-3 py-2 text-sm dark:border-slate-700"><span x-text="dark?'☀️ Light':'🌙 Dark'"></span></button>
<button @click="showOnlyImportant=!showOnlyImportant" class="rounded-lg border px-3 py-2 text-sm dark:border-slate-700" :class="showOnlyImportant?'bg-amber-100 text-amber-700':''">⭐ Important</button>
<button @click="resetProgress()" class="rounded-lg border border-red-200 px-3 py-2 text-sm text-red-600 dark:border-red-900">Reset</button>
</div>
</div>
</div>
</header>

<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">

<section class="grid grid-cols-2 gap-4 md:grid-cols-5">
<template x-for="s in stats" :key="s.label">
<div class="rounded-2xl bg-white p-5 shadow-sm dark:bg-slate-900">
<div class="text-sm text-slate-500" x-text="s.label"></div>
<div class="mt-2 text-2xl font-bold" :class="s.cls" x-text="s.value"></div>
</div>
</template>
</section>

<section class="mt-6 rounded-2xl bg-white p-5 shadow-sm dark:bg-slate-900">
<div class="flex items-center justify-between">
<h2 class="font-semibold">Overall Progress</h2><span class="font-bold text-indigo-600" x-text="progress+'%'"></span>
</div>
<div class="mt-3 h-3 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-full rounded-full bg-indigo-600 transition-all" :style="`width:${progress}%`"></div>
</div>
<div class="mt-3 text-xs text-slate-500" x-text="completedCount+' of '+topics.length+' topics completed'"></div>
</section>

<section class="mt-6 rounded-2xl bg-white p-5 shadow-sm dark:bg-slate-900">
<div class="grid gap-3 md:grid-cols-5">
<input x-model="search" class="rounded-lg border px-3 py-2 dark:border-slate-700 dark:bg-slate-800" placeholder="🔍 Search topics...">
<select x-model="category" class="rounded-lg border px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
<option value="All">All Categories</option><template x-for="c in categories"><option :value="c" x-text="c"></option></template>
</select>
<select x-model="status" class="rounded-lg border px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
<option value="All">All Status</option><option>Pending</option><option>Completed</option>
</select>
<select x-model="difficulty" class="rounded-lg border px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
<option value="All">All Difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option>
</select>
<select x-model="sortBy" class="rounded-lg border px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
<option value="default">Default Order</option><option value="difficulty">Difficulty</option><option value="category">Category</option><option value="title">Title</option>
</select>
</div>
</section>

<section class="mt-6">
<div class="mb-4 flex items-center justify-between">
<h2 class="text-lg font-bold">Revision Topics</h2>
<span class="text-sm text-slate-500" x-text="filteredTopics.length+' topics'"></span>
</div>

<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
<template x-for="topic in filteredTopics" :key="topic.id">
<article class="rounded-2xl border bg-white p-5 shadow-sm hover:shadow-md dark:border-slate-800 dark:bg-slate-900" :class="topic.done?'border-emerald-300 dark:border-emerald-800':''">
<div class="flex items-start justify-between gap-3">
<div>
<div class="mb-2 flex flex-wrap gap-2">
<span class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300" x-text="topic.category"></span>
<span class="rounded-full px-2.5 py-1 text-xs" :class="difficultyClass(topic.difficulty)" x-text="topic.difficulty"></span>
</div>
<h3 class="text-lg font-bold" x-text="topic.title"></h3>
</div>
<button @click="toggleDone(topic)" class="grid h-9 w-9 shrink-0 place-items-center rounded-full border" :class="topic.done?'border-emerald-500 bg-emerald-500 text-white':''"><span x-text="topic.done?'✓':'○'"></span></button>
</div>

<p class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-400" x-text="topic.description"></p>

<div class="mt-4">
<div class="text-xs font-semibold uppercase tracking-wide text-slate-400">Interview Questions</div>
<ul class="mt-2 space-y-1 text-sm">
<template x-for="q in topic.questions"><li class="flex gap-2"><span class="text-indigo-500">•</span><span x-text="q"></span></li></template>
</ul>
</div>

<div class="mt-4 flex flex-wrap gap-2">
<template x-for="tag in topic.tags"><span class="rounded bg-slate-100 px-2 py-1 text-xs dark:bg-slate-800" x-text="'#'+tag"></span></template>
</div>

<div class="mt-5 flex gap-2">
<button @click="openNotes(topic)" class="flex-1 rounded-lg bg-slate-100 px-3 py-2 text-sm dark:bg-slate-800">📝 Notes</button>
<button @click="toggleImportant(topic)" class="rounded-lg px-3 py-2 text-sm" :class="topic.important?'bg-amber-100 text-amber-700 dark:bg-amber-950':'bg-slate-100 dark:bg-slate-800'" x-text="topic.important?'⭐':'☆'"></button>
</div>
</article>
</template>
</div>
<div x-show="filteredTopics.length===0" class="rounded-2xl bg-white p-10 text-center shadow-sm dark:bg-slate-900">🔎 No topics found</div>
</section>
</main>

<div x-show="notesOpen" x-cloak class="fixed inset-0 z-50 grid place-items-center bg-black/50 p-4">
<div @click.outside="notesOpen=false" class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-xl dark:bg-slate-900">
<div class="flex justify-between"><div><div class="text-sm text-indigo-600" x-text="selectedTopic?.category"></div><h2 class="text-xl font-bold" x-text="selectedTopic?.title"></h2></div><button @click="notesOpen=false" class="text-2xl">×</button></div>
<textarea x-model="selectedTopic.notes" class="mt-5 h-56 w-full rounded-xl border p-4 dark:border-slate-700 dark:bg-slate-800" placeholder="Write revision notes..."></textarea>
<div class="mt-4 flex justify-end gap-2"><button @click="notesOpen=false" class="rounded-lg border px-4 py-2">Close</button><button @click="saveNotes()" class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Save Notes</button></div>
</div>
</div>

</div>
<style>[x-cloak]{display:none!important}</style>
<script src="./assets/app.js"></script>
</body>
</html>
