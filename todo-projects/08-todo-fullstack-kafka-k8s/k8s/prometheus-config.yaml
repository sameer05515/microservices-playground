apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: todo-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway:8088']
      - job_name: auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['auth-service:8081']
      - job_name: todo-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['todo-service:8080']
