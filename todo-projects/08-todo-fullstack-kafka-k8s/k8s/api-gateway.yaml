apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: todo-platform
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: api-gateway
          image: todo-platform/api-gateway:1.0.0
          ports: [{containerPort: 8088}]
          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: EUREKA_URL
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8088}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8088}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "768Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: todo-platform
spec:
  selector: {app: api-gateway}
  ports: [{port: 8088, targetPort: 8088}]
