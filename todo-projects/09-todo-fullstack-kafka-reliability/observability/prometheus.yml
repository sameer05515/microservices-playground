global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8088"]
  - job_name: todo-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["todo-service-1:8080", "todo-service-2:8080"]
