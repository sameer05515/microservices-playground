server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: product
          uri: http://localhost:8081
          predicates: [Path=/products/**]
        - id: customer
          uri: http://localhost:8082
          predicates: [Path=/customers/**]
        - id: order
          uri: http://localhost:8083
          predicates: [Path=/orders/**]
