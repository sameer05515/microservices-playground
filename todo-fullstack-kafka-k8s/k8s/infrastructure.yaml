apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: todo-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: todo-platform }
spec:
  selector: { app: redis }
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: todo-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.9
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_CFG_NODE_ID, value: "1"}
            - {name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker"}
            - {name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: todo-platform}
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-mysql
  namespace: todo-platform
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-mysql}}
  template:
    metadata: {labels: {app: auth-mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - {name: MYSQL_DATABASE, value: auth_db}
            - {name: MYSQL_ROOT_PASSWORD, value: root}
          ports: [{containerPort: 3306}]
---
apiVersion: v1
kind: Service
metadata: {name: auth-mysql, namespace: todo-platform}
spec:
  selector: {app: auth-mysql}
  ports: [{port: 3306, targetPort: 3306}]
---
