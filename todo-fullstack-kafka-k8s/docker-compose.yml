services:
  auth-mysql:
    image: mysql:8.4
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes: [auth_mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  todo-mysql:
    image: mysql:8.4
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: todo_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [todo_mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    restart: unless-stopped
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.9
    container_name: todo-kafka
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  eureka-server:
    build: { context: ./eureka-server }
    ports: ["8761:8761"]

  auth-service:
    build: { context: ./auth-service }
    environment:
      AUTH_DB_URL: jdbc:mysql://auth-mysql:3306/auth_db?useSSL=false&serverTimezone=UTC
      AUTH_DB_USERNAME: root
      AUTH_DB_PASSWORD: root
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: change-this-secret-key-to-at-least-32-characters-long
    depends_on:
      auth-mysql: { condition: service_healthy }
      eureka-server: { condition: service_started }

  todo-service-1:
    build: { context: ./todo-service }
    environment:
      TODO_DB_URL: jdbc:mysql://todo-mysql:3306/todo_db?useSSL=false&serverTimezone=UTC
      TODO_DB_USERNAME: root
      TODO_DB_PASSWORD: root
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: change-this-secret-key-to-at-least-32-characters-long
    depends_on:
      todo-mysql: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      eureka-server: { condition: service_started }

  todo-service-2:
    build: { context: ./todo-service }
    environment:
      TODO_DB_URL: jdbc:mysql://todo-mysql:3306/todo_db?useSSL=false&serverTimezone=UTC
      TODO_DB_USERNAME: root
      TODO_DB_PASSWORD: root
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: change-this-secret-key-to-at-least-32-characters-long
    depends_on:
      todo-mysql: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      eureka-server: { condition: service_started }

  api-gateway:
    build: { context: ./api-gateway }
    ports: ["8088:8088"]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server: { condition: service_started }

volumes:
  auth_mysql_data:
  todo_mysql_data:
